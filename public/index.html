<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#212121"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="description"
      content="Vixy-AI — Passwordless Sign In & Sign Up"
    />
    <title>Vixy-AI — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-logo">
        <div class="logo-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-width="2"
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"
            />
          </svg>
        </div>
        <span class="logo-text">Vixy AI</span>
      </div>

      <div class="auth-card">
        <!-- Send OTP via Email / Google Sign-In -->
        <form
          id="stepEmail"
          class="form active"
          onsubmit="return false;"
          novalidate
        >
          <div>
            <h1 class="form-title">Welcome to Vixy AI</h1>
            <p class="form-subtitle">
              Sign in or create an account
            </p>
          </div>

          <div id="emailMsg" class="form-msg" role="alert"></div>

          <div class="field">
            <label for="auth_email">Email Address</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-width="2"
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline stroke-width="2" points="22,6 12,13 2,6" />
              </svg>
              <input
                id="auth_email"
                type="email"
                placeholder="you@mail.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <button
            type="button"
            id="sendOtpBtn"
            class="submit-btn"
            onclick="sendOtp()"
          >
            <span id="sendOtpBtnText">Continue with Email</span>
            <div id="sendOtpSpinner" class="spinner"></div>
          </button>

          <div class="divider"><span>OR</span></div>

          <button
            type="button"
            id="googleBtn"
            class="google-btn"
            onclick="loginWithGoogle()"
          >
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            Continue with Google
          </button>
        </form>

        <!-- Verify 6-digit OTP Code -->
        <form id="stepOtp" class="form" onsubmit="return false;" novalidate>
          <div>
            <h1 class="form-title">Enter Verification Code</h1>
            <p class="form-subtitle">
              We sent a 6-digit code to
              <strong id="sentEmailSpan" style="color: var(--text)"></strong>
            </p>
          </div>

          <div id="otpMsg" class="form-msg" role="alert"></div>

          <div class="field">
            <label for="auth_otp">6-Digit Code</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect
                  x="3"
                  y="11"
                  width="18"
                  height="11"
                  rx="2"
                  stroke-width="2"
                />
                <path stroke-width="2" d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <input
                id="auth_otp"
                type="text"
                class="otp-input"
                placeholder="123456"
                maxlength="6"
                autocomplete="one-time-code"
                required
              />
            </div>
          </div>

          <button
            type="button"
            id="verifyOtpBtn"
            class="submit-btn"
            onclick="verifyOtp()"
          >
            <span id="verifyOtpBtnText">Verify & Continue</span>
            <div id="verifyOtpSpinner" class="spinner"></div>
          </button>

          <button
            type="button"
            class="secondary-action"
            onclick="showStep('stepEmail')"
          >
            ← Use a different email address
          </button>
        </form>

        <!-- Choose Username (Onboarding) -->
        <form
          id="stepUsername"
          class="form"
          onsubmit="return false;"
          novalidate
        >
          <div>
            <h1 class="form-title">Choose your Username</h1>
            <p class="form-subtitle">What should Vixy call you in chat?</p>
          </div>

          <div id="usernameMsg" class="form-msg" role="alert"></div>

          <div class="field">
            <label for="auth_username">Username</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-width="2"
                  d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"
                />
                <circle cx="12" cy="7" r="4" stroke-width="2" />
              </svg>
              <input
                id="auth_username"
                type="text"
                placeholder="Your username"
                autocomplete="name"
                required
              />
            </div>
          </div>

          <button
            type="button"
            id="setUsernameBtn"
            class="submit-btn"
            onclick="saveUsernameAndContinue()"
          >
            <span id="setUsernameBtnText">Start Chatting with Vixy</span>
            <div id="setUsernameSpinner" class="spinner"></div>
          </button>
        </form>
      </div>

      <div class="auth-footer">
        By continuing, you agree to our Terms of Service and Privacy Policy.
      </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
